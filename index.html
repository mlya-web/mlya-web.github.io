<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無題のホームページ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="welcome">
      <h1>ようこそ！</h1>
      <div class="counter">あなたは <strong>000123</strong> 人目のお客様です</div>
      <p class="kiriban">キリ番を踏んだらラッキー！　踏み逃げOK</p>
    </header>

    <p class="construction">★このサイトは現在も工事中です★</p>

    <main>
      <section class="panel daily">
        <h2>今日の一言</h2>
        <p id="daily-message">本日の一言を読み込み中...</p>
      </section>

      <section class="panel notices">
        <h2>おしらせ</h2>
        <p>特にお知らせはありません</p>
      </section>

      <!-- GIFは決まったら、ここやページ内の好きな場所に img タグで追加します。 -->
    </main>

    <footer>またきてね！</footer>
  </div>

  <script>
    const messages = [
      '今日は特に何もありません。',
      '管理人は水を飲みました。',
      'このサイトに深い意味はありません。',
      '本日の営業は通常どおり、特に何もしていません。',
      '何かを更新したい気持ちだけはあります。',
      'ここまで来てくれてありがとうございます。',
      '今日は昨日の次の日です。',
      '重要なお知らせはありません。'
    ];

    // 日付を使って選ぶので、同じ日は同じ一言、翌日は別の一言になります。
    const today = new Date();
    const dayNumber = Math.floor(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()) / 86400000);
    const message = messages[dayNumber % messages.length];
    document.getElementById('daily-message').textContent = message;
  </script>
</body>
</html>
